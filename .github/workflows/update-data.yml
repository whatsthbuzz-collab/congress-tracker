name: Update Congressional Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/fetch_congress_data.py

      - name: Commit changes
        run: |
          git config user.name "Congress Bot"
          git config user.email "bot@congress-tracker.local"
          git add public/congress_data.json
          if git diff --cached --quiet; then
            echo "No changes to data"
          else
            git commit -m "chore: update congressional data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
