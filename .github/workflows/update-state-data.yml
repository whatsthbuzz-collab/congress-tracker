name: Update State Data

on:
  schedule:
    # LegiScan rebuilds datasets Sunday ~5am ET; we pull Monday morning UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  fetch-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      # Two-letter codes, comma-separated. Add states here.
      STATES: "TX"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch state legislature data
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python scripts/state_legislature.py

      - name: Commit changes
        run: |
          git config user.name "Congress Bot"
          git config user.email "bot@congress-tracker.local"
          git add public/state_data.json
          if git diff --cached --quiet; then
            echo "No changes to state data"
          else
            git commit -m "chore: update state legislature data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
