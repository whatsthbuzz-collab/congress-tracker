name: Update State Data

on:
  schedule:
    # LegiScan rebuilds datasets Sunday ~5am ET; we pull Monday morning UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  fetch-state:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      # Two-letter codes, comma-separated. Add states here.
      STATES: "AL,AK,AZ,AR,CA,CO,CT,DE,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch state legislature data
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python scripts/state_legislature.py

      - name: Commit changes
        run: |
          git config user.name "Congress Bot"
          git config user.email "bot@congress-tracker.local"
          git add public/state
          if git diff --cached --quiet; then
            echo "No changes to state data"
          else
            git commit -m "chore: update state legislature data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
