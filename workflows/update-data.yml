name: Update Congressional Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data
        run: python scripts/fetch_congress_data.py

      - name: Commit changes
        run: |
          git config user.name "Congress Bot"
          git config user.email "bot@congress-tracker.local"
          if not git diff --quiet public/congress_data.json (
            git add public/congress_data.json
            git commit -m "chore: update congressional data"
            git push
          )
